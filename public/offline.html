<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f97316">
    <title>EduKit is offline</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { align-items: center; background: #fff7ed; color: #071d4f; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
        main { max-width: 420px; }
        img { border-radius: 24px; height: 96px; object-fit: cover; width: 96px; }
        h1 { margin: 24px 0 8px; }
        p { color: #475569; line-height: 1.6; }
        button { background: #ea580c; border: 0; border-radius: 8px; color: #fff; cursor: pointer; font-weight: 700; padding: 12px 18px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/website/EDUKIT_STORE_logo2.png" alt="EduKit Store">
        <h1>You are offline</h1>
        <p>EduKit could not connect right now. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
